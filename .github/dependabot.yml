version: 2
updates:
  # Две dev-зависимости, но esbuild закреплён точной версией: сборка обязана быть байт-в-байт
  # воспроизводимой (CI сверяет), поэтому его обновление приходит отдельным PR и проходит все тесты.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
