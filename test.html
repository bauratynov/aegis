<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis — Tests</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; background: #0d1117; color: #c9d1d9; }
        h1 { font-size: 20px; margin-bottom: 16px; color: #58a6ff; }
        .test { padding: 8px 12px; margin: 2px 0; border-radius: 6px; font-size: 13px; font-family: monospace; }
        .pass { background: #0d1f0d; color: #3fb950; border-left: 3px solid #3fb950; }
        .fail { background: #2d1014; color: #f85149; border-left: 3px solid #f85149; }
        .section { font-size: 14px; font-weight: 600; color: #8b949e; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 1px; }
        #summary { margin-top: 20px; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; }
        .summary-pass { background: #0d1f0d; color: #3fb950; border: 1px solid #238636; }
        .summary-fail { background: #2d1014; color: #f85149; border: 1px solid #da3633; }
    </style>
</head>
<body>
    <h1>⚡ Aegis v0.1.0 — Test Suite</h1>
    <div id="results"></div>
    <div id="summary"></div>
    <div id="sandbox" style="display:none;"></div>

    <script type="module">
    import {
        signal, computed, effect, batch, isSignal,
        createScope, onDispose,
        on, delegate, interval, timeout,
        guardedFetch, debounced, throttled,
        html, text, attr, cls, style, bind, show, list,
        component, register, hydrate, destroy, destroyAll,
        render, $, $$,
        resource, watch, store, portal, transition, errorBoundary, ref,
        reactive, isReactive,
        form, required, minLen, maxLen, emailRule, matches,
        wireForm, cachedResource, invalidate, seed, seedFrom, attach, clone, expose, getOwner, runWithOwner, configure, request, api, HttpError, mutation, streamResource, settled, prefetch, infiniteResource, dev, onWarn, AegisWarning, reset, flushSync, root, until, flush, stats, trace, island, element, from, history as undoHistory, size, inView, viewport, springSignal, tween, modal, scaffold, setValidationMessages, maxSize, mime, maxFiles, createContext, provide, inject, persisted, linked, selector, when, cssVars, media, defaults, swap, boost, tpl, adopt, jsonScript,
        spring, flip, animate,
        trap, roving, announce,
        css, adoptStyles, scopedStyle,
        defineElement, anchor, router, command, virtualScroll,
        offlineResource,
        lazy, nextTick, i18n, uncloak, injectStyles,
        VERSION, mount, cache, withRetry, leader, predictor, speculate, prefetchOn, onError, lens, signals, fieldArray, min, wizard, draft, live, busy, tabbables, startTransition, deferred, transaction } from './aegis.js';

    const results = document.getElementById('results');
    const sandbox = document.getElementById('sandbox');
    const REPORT = /[?&]report/.test(location.search);   // ?report=1 → POST /__report (браузеры без --dump-dom); флаг фиксируется до того, как тесты роутера перепишут URL
    if (REPORT) { const post = (o) => fetch('/__report?partial', { method: 'POST', body: JSON.stringify(o) }).catch(() => {}); addEventListener('error', (e) => post({ error: String(e.message), line: e.lineno, col: e.colno, stack: e.error && e.error.stack })); addEventListener('unhandledrejection', (e) => post({ rejection: String(e.reason && e.reason.message || e.reason), stack: e.reason && e.reason.stack })); }
    defaults.motion = true;   // prefers-reduced-motion ОС не должен влиять на сьют (motion: 'auto' проверяется отдельно)
    dev.overlay = false;      // тосты dev-overlay не нужны в сьюте
    dev.contracts = 'strict'; // runtime-контракты графа/scope на каждом flush — все ~1000 assert'ов проверяют инварианты
    let passed = 0, failed = 0;

    function section(name) {
        if (REPORT) fetch('/__report?partial', { method: 'POST', body: JSON.stringify({ section: name, passed, failed }) }).catch(() => {});
        const el = document.createElement('div');
        el.className = 'section';
        el.textContent = name;
        results.appendChild(el);
    }

    function assert(name, condition) {
        const el = document.createElement('div');
        el.className = 'test ' + (condition ? 'pass' : 'fail');
        el.textContent = (condition ? '✓' : '✗') + ' ' + name;
        results.appendChild(el);
        if (condition) passed++; else failed++;
        if (REPORT) fetch('/__report?partial', { method: 'POST', body: JSON.stringify({ last: name, passed, failed }) }).catch(() => {});
    }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    // ======= TESTS =======

    section('Signal');

    (() => {
        const s = signal(42, 'test');
        assert('signal создаётся с начальным значением', s.value === 42);
        assert('peek() читает без подписки', s.peek() === 42);
        assert('isSignal() распознаёт', isSignal(s));
        assert('isSignal() на обычных = false', !isSignal(42) && !isSignal({}) && !isSignal(null));

        s.value = 100;
        assert('value setter меняет значение', s.value === 100);

        s.update(v => v + 1);
        assert('update() через функцию', s.value === 101);

        // Одинаковое значение не вызывает уведомление
        let callCount = 0;
        s.subscribe(() => callCount++);
        s.value = 101; // то же самое
        assert('Object.is — нет уведомления при том же значении', callCount === 0);
    })();

    section('Computed');

    (() => {
        const a = signal(2);
        const b = signal(3);
        const sum = computed(() => a.value + b.value, 'sum');

        assert('computed вычисляется', sum.value === 5);
        assert('computed — isSignal', isSignal(sum));

        a.value = 10;
        // computed ленивый — пересчитается при следующем чтении
        assert('computed пересчитывается при изменении зависимости', sum.value === 13);

        // peek без подписки
        assert('computed peek()', sum.peek() === 13);
    })();

    section('Effect');

    await (async () => {
        const s = signal(0);
        let effectValue = -1;

        const dispose = effect(() => { effectValue = s.value; });
        assert('effect вызывается сразу', effectValue === 0);

        s.value = 5;
        await wait(10); // microtask flush
        assert('effect вызывается при изменении сигнала', effectValue === 5);

        dispose();
        s.value = 99;
        await wait(10);
        assert('dispose() останавливает effect', effectValue === 5);
    })();

    section('Batch');

    await (async () => {
        const a = signal(1);
        const b = signal(2);
        let callCount = 0;

        effect(() => { a.value; b.value; callCount++; });
        callCount = 0; // reset после первого вызова

        batch(() => {
            a.value = 10;
            b.value = 20;
        });
        await wait(10);
        assert('batch: effect вызывается 1 раз, не 2', callCount === 1);
    })();

    section('Scope & Auto-cleanup');

    (() => {
        const scope = createScope();
        let cleaned = false;
        let effectRan = false;

        scope.run(() => {
            onDispose(() => { cleaned = true; });
            const s = signal(1);
            effect(() => { effectRan = s.value > 0; });
        });

        assert('scope.run выполняет функцию', effectRan);
        assert('до dispose cleanup не вызван', !cleaned);

        scope.dispose();
        assert('dispose вызывает cleanup', cleaned);
    })();

    (() => {
        const parent = createScope();
        let childCleaned = false;

        parent.run(() => {
            const child = createScope();
            child.run(() => {
                onDispose(() => { childCleaned = true; });
            });
        });

        parent.dispose();
        assert('dispose родителя чистит дочерний scope', childCleaned);
    })();

    section('on() — auto-remove listener');

    (() => {
        const scope = createScope();
        let clicked = 0;
        const btn = document.createElement('button');

        scope.run(() => {
            on(btn, 'click', () => clicked++);
        });

        btn.click();
        assert('on() привязывает listener', clicked === 1);

        scope.dispose();
        btn.click();
        assert('dispose снимает listener', clicked === 1);
    })();

    section('delegate()');

    (() => {
        const scope = createScope();
        let clickedId = null;
        const container = document.createElement('div');
        container.innerHTML = '<button class="item" data-id="42">Click</button>';

        scope.run(() => {
            delegate(container, 'click', '.item', (e, target) => {
                clickedId = target.dataset.id;
            });
        });

        container.querySelector('.item').click();
        assert('delegate ловит клик по селектору', clickedId === '42');

        scope.dispose();
    })();

    section('interval / timeout — auto-cleanup');

    await (async () => {
        const scope = createScope();
        let ticks = 0;

        scope.run(() => {
            interval(() => ticks++, 50);
        });

        await wait(1200); // Chrome throttles background tabs to ~1s
        const ticksBefore = ticks;
        assert('interval тикает', ticksBefore >= 1);

        scope.dispose();
        await wait(50);
        assert('interval остановлен после dispose', ticks === ticksBefore);
    })();

    section('debounced — auto-cancel');

    await (async () => {
        const scope = createScope();
        let result = 0;

        let db;
        scope.run(() => {
            db = debounced((v) => { result = v; }, 30);
        });

        db(1);
        db(2);
        db(3);
        await wait(50);
        assert('debounce: только последнее значение', result === 3);

        result = 0;
        scope.dispose();
        db(99);
        await wait(50);
        assert('debounce: cancel после dispose', result === 0);
    })();

    section('text() / attr() / cls() / style()');

    await (async () => {
        const el = document.createElement('div');
        sandbox.appendChild(el);

        const name = signal('World');
        const scope = createScope();

        scope.run(() => {
            text(el, () => `Hello ${name.value}`);
        });
        assert('text() привязка', el.textContent === 'Hello World');

        name.value = 'Aegis';
        await wait(10);
        assert('text() обновляется', el.textContent === 'Hello Aegis');

        scope.dispose();
        sandbox.innerHTML = '';
    })();

    await (async () => {
        const el = document.createElement('div');
        sandbox.appendChild(el);

        const active = signal(false);
        const scope = createScope();

        scope.run(() => {
            cls(el, 'active', active);
        });
        assert('cls() — изначально нет класса', !el.classList.contains('active'));

        active.value = true;
        await wait(10);
        assert('cls() — добавляет класс', el.classList.contains('active'));

        active.value = false;
        await wait(10);
        assert('cls() — убирает класс', !el.classList.contains('active'));

        scope.dispose();
        sandbox.innerHTML = '';
    })();

    section('bind() — two-way');

    await (async () => {
        const input = document.createElement('input');
        input.type = 'text';
        sandbox.appendChild(input);

        const val = signal('hello');
        const scope = createScope();

        scope.run(() => {
            bind(input, val);
        });

        assert('bind() signal→DOM', input.value === 'hello');

        val.value = 'world';
        await wait(10);
        assert('bind() signal→DOM обновление', input.value === 'world');

        // DOM → Signal
        input.value = 'typed';
        input.dispatchEvent(new Event('input'));
        assert('bind() DOM→signal', val.value === 'typed');

        scope.dispose();
        sandbox.innerHTML = '';
    })();

    section('show() — условный рендер');

    await (async () => {
        const container = document.createElement('div');
        sandbox.appendChild(container);

        const visible = signal(true);
        const scope = createScope();

        scope.run(() => {
            const anchor = show(visible,
                () => { const el = document.createElement('span'); el.textContent = 'YES'; return el; },
                () => { const el = document.createElement('span'); el.textContent = 'NO'; return el; }
            );
            container.appendChild(anchor);
        });
        await wait(10);
        assert('show() true branch', container.textContent.includes('YES'));

        visible.value = false;
        await wait(10);
        assert('show() false branch', container.textContent.includes('NO') && !container.textContent.includes('YES'));

        scope.dispose();
        sandbox.innerHTML = '';
    })();

    section('list() — keyed reconciliation');

    await (async () => {
        const container = document.createElement('div');
        sandbox.appendChild(container);

        const items = signal([
            { id: 1, name: 'Alpha' },
            { id: 2, name: 'Beta' },
        ]);
        const scope = createScope();

        scope.run(() => {
            const anchor = list(items, (item) => {
                const li = document.createElement('div');
                li.textContent = item.name;
                li.dataset.id = item.id;
                return li;
            }, 'id');
            container.appendChild(anchor);
        });
        await wait(10);
        assert('list() рендерит элементы', container.querySelectorAll('[data-id]').length === 2);
        assert('list() правильный текст', container.textContent.includes('Alpha') && container.textContent.includes('Beta'));

        // Добавить
        items.value = [...items.value, { id: 3, name: 'Gamma' }];
        await wait(10);
        assert('list() добавление', container.querySelectorAll('[data-id]').length === 3);

        // Удалить
        items.value = items.value.filter(i => i.id !== 2);
        await wait(10);
        assert('list() удаление', container.querySelectorAll('[data-id]').length === 2);
        assert('list() Beta удалён', !container.textContent.includes('Beta'));

        scope.dispose();
        sandbox.innerHTML = '';
    })();

    section('list() — замена объекта, index-сигнал, дубликаты ключей');

    await (async () => {
        const container = document.createElement('div');
        sandbox.appendChild(container);
        const items = signal([
            { id: 1, name: 'Alpha' },
            { id: 2, name: 'Beta' },
            { id: 3, name: 'Gamma' },
        ]);
        const scope = createScope();
        scope.run(() => {
            const anchor = list(items, (item, index) => {
                const li = document.createElement('div');
                li.dataset.id = item.id;
                text(li, () => index.value + ':' + item.name);
                return li;
            }, 'id');
            container.appendChild(anchor);
        });
        await wait(10);
        assert('list() index-сигнал: нумерация при создании', container.textContent === '0:Alpha1:Beta2:Gamma');

        // Иммутабельная замена объекта с тем же ключом
        const firstNode = container.querySelector('[data-id="1"]');
        items.value = items.value.map(x => x.id === 2 ? { ...x, name: 'Beta2' } : x);
        await wait(10);
        assert('list() замена объекта под ключом перерисовывает строку', container.textContent.includes('1:Beta2'));
        assert('list() нетронутые строки сохраняют DOM-узел', container.querySelector('[data-id="1"]') === firstNode);

        // Удаление сверху → индексы сдвигаются
        items.value = items.value.filter(x => x.id !== 1);
        await wait(10);
        assert('list() index-сигнал после удаления', container.textContent === '0:Beta21:Gamma');

        // Reverse
        items.value = [...items.value].reverse();
        await wait(10);
        assert('list() index-сигнал после сортировки', container.textContent === '0:Gamma1:Beta2');

        // Дубликаты и отсутствующие ключи не теряют строки
        items.value = [{ id: 7, name: 'x' }, { id: 7, name: 'y' }, { name: 'nokey' }];
        await wait(10);
        assert('list() дубликаты ключей рендерят все строки', container.querySelectorAll('div').length === 3);

        scope.dispose();
        assert('list() dispose scope убирает строки', container.querySelectorAll('div').length === 0);
        sandbox.innerHTML = '';
    })();

    section('list() внутри html``');

    await (async () => {
        const items = signal([{ id: 1, name: 'A' }, { id: 2, name: 'B' }]);
        const scope = createScope();
        const frag = scope.run(() => html`<ul>${list(items, item => html`<li>${item.name}</li>`)}</ul>`);
        sandbox.appendChild(frag);
        await wait(10);
        assert('html: list()-якорь монтируется, а не превращается в текст', sandbox.querySelectorAll('li').length === 2 && !sandbox.textContent.includes('object Comment'));
        items.value = [...items.value, { id: 3, name: 'C' }];
        await wait(10);
        assert('html: list() реактивен внутри шаблона', sandbox.querySelectorAll('li').length === 3);
        scope.dispose();
        sandbox.innerHTML = '';
    })();

    section('show() — keep: true (аналог v-show)');

    await (async () => {
        const container = document.createElement('div');
        sandbox.appendChild(container);
        const visible = signal(true);
        let builds = 0;
        const scope = createScope();
        scope.run(() => {
            const anchor = show(visible, () => {
                builds++;
                const input = document.createElement('input');
                input.className = 'kept';
                return input;
            }, () => { const s = document.createElement('span'); s.textContent = 'NO'; return s; }, { keep: true });
            container.appendChild(anchor);
        });
        await wait(10);
        const input = container.querySelector('input.kept');
        input.value = 'typed';
        visible.value = false;
        await wait(10);
        assert('show keep: ветка скрыта, но остаётся в DOM', container.querySelector('input.kept') === input && input.offsetParent === null);
        assert('show keep: false-ветка показана', container.textContent.includes('NO'));
        visible.value = true;
        await wait(10);
        assert('show keep: тот же узел, состояние сохранено', container.querySelector('input.kept') === input && input.value === 'typed' && builds === 1);
        scope.dispose();
        assert('show keep: dispose убирает обе ветки', container.querySelector('input.kept') === null && !container.textContent.includes('NO'));
        sandbox.innerHTML = '';
    })();

    section('reactive() — массивы и ключи');

    (() => {
        const state = reactive({ items: [{ id: 1, done: false }], meta: {} });
        let len = 0, lenRuns = 0;
        effect(() => { len = state.items.length; lenRuns++; });
        state.items.push({ id: 2, done: false });
        assert('reactive: push уведомляет', len === 2 && lenRuns === 2);

        let doneSeen = null;
        effect(() => { doneSeen = state.items[0].done; });
        state.items[0].done = true;
        assert('reactive: мутация элемента массива уведомляет', doneSeen === true);
        assert('reactive: элемент массива — стабильный proxy', state.items[0] === state.items[0]);

        let count = 0;
        effect(() => { count = state.items.filter(i => i.done).length; });
        state.items[1].done = true;
        assert('reactive: filter реактивен', count === 2);
        state.items.splice(0, 1);
        assert('reactive: splice уведомляет', len === 1 && count === 1);
        state.items[0] = { id: 3, done: false };
        assert('reactive: запись по индексу уведомляет', count === 0);

        let keys = [];
        effect(() => { keys = Object.keys(state.meta); });
        state.meta.a = 1;
        assert('reactive: добавление ключа уведомляет ownKeys', keys.join() === 'a');
        delete state.meta.a;
        assert('reactive: удаление ключа уведомляет', keys.length === 0);
        let hasX = null;
        effect(() => { hasX = 'x' in state.meta; });
        state.meta.x = 1;
        assert('reactive: `in` реактивен', hasX === true);

        assert('reactive: toJSON', JSON.stringify(state) === '{"items":[{"id":3,"done":false}],"meta":{"x":1}}');
        assert('reactive: String(proxy) не падает', typeof String(state) === 'string');
        assert('reactive: один объект — один proxy', reactive(state.items.$raw) === state.items);
        assert('reactive: массив — isReactive', isReactive(state.items) && Array.isArray(state.items));
    })();

    section('reactive() + list()');

    await (async () => {
        const container = document.createElement('div');
        sandbox.appendChild(container);
        const state = reactive({ rows: [{ id: 1, name: 'a' }, { id: 2, name: 'b' }] });
        const scope = createScope();
        scope.run(() => {
            container.appendChild(list(() => state.rows, (row) => {
                const d = document.createElement('div');
                text(d, () => row.name);
                return d;
            }));
        });
        await wait(10);
        assert('reactive+list: рендер', container.textContent === 'ab');
        state.rows.push({ id: 3, name: 'c' });
        await wait(10);
        assert('reactive+list: push добавляет строку', container.textContent === 'abc');
        state.rows[0].name = 'A';
        await wait(10);
        assert('reactive+list: мутация элемента обновляет ячейку', container.textContent === 'Abc');
        state.rows.reverse();
        await wait(10);
        assert('reactive+list: reverse переставляет', container.textContent === 'cbA');
        scope.dispose();
        sandbox.innerHTML = '';
    })();

    section('store() — batched actions');

    (() => {
        const s = store({
            a: 1, b: 2,
            get sum() { return this.a + this.b; },
            bump() { this.a++; this.b++; },
        });
        let runs = 0, sum = 0;
        effect(() => { sum = s.sum; runs++; });
        s.bump();
        assert('store: action — один запуск effect', runs === 2 && sum === 5);
        assert('store: стабильная ссылка на метод', s.bump === s.bump);
        assert('store: String(store) не падает', typeof String(s) === 'string');
    })();

    section('html`` — onclick=${fn}');

    (() => {
        let clicks = 0;
        const frag = html`<button class="ev" onclick=${() => clicks++}>go</button>`;
        sandbox.appendChild(frag);
        const btn = sandbox.querySelector('button.ev');
        assert('html: onclick не вызывается при рендере', clicks === 0);
        assert('html: onclick не становится атрибутом', !btn.hasAttribute('onclick'));
        btn.click();
        assert('html: onclick вешает обработчик', clicks === 1);
        sandbox.innerHTML = '';
    })();

    section('router() — scope на маршрут');

    await (async () => {
        const scope = createScope();
        let disposedA = 0, effectRunsA = 0;
        const tick = signal(0);
        let r;
        scope.run(() => {
            r = router({
                '/a': () => { onDispose(() => disposedA++); effect(() => { tick.value; effectRunsA++; }); },
                '/b': () => {},
                '*': () => {},
            });
        });
        r.navigate('/a', { replace: true });
        await wait(30);
        tick.value++;
        assert('router: effect маршрута работает', effectRunsA === 2);
        r.navigate('/b', { replace: true });
        await wait(30);
        tick.value++;
        assert('router: scope предыдущего маршрута уничтожен', disposedA === 1 && effectRunsA === 2);
        scope.dispose();
        history.replaceState(null, '', '/test.html');
    })();

    section('html`` — парсер (конечный автомат)');

    (() => {
        const url = signal('/a');
        const f1 = html`<a title="x > y" href=${url}>${'t'}</a>`;
        const a = f1.querySelector('a');
        assert('html: > внутри значения атрибута не ломает привязки', a.getAttribute('href') === '/a' && a.textContent === 't' && a.title === 'x > y');
        url.value = '/b';
        assert('html: реактивный href', a.getAttribute('href') === '/b');

        const cls = signal('on');
        const f2 = html`<div class="base ${cls} ${() => 'x'}"></div>`;
        const d = f2.querySelector('div');
        assert('html: несколько значений в одном атрибуте', d.className === 'base on x');
        cls.value = 'off';

        const off = onWarn(w => seen.push(w));
        dev.resetWarnings();
        let calls = [];
        const fetcher = async (url) => { calls.push(url); return { url, n: calls.length }; };

        // канонические ключи: 5 вариантов одного URL → одна запись, один запрос
        const sc = createScope();
        const urls = ['/t/c?q=a&page=1', '/t/c?page=1&q=a', '/t/c?page=1&q=a&', '/t/c?page=1&q=a&sort=', '/t/c?page=1&q=a#top'];
        const rs = [];
        sc.run(() => { for (const u of urls) rs.push(resource(u, { cache: true, staleTime: 60000, fetcher })); });

        assert('cache: 5 перестановок URL → одна запись и один запрос', calls.length === 1 && stats().resourceCache === 1 && rs.every(r => r.data.value === rs[0].data.value));

        // loader + cache: params с разным порядком полей делят запись; loader вызывается
        let loads = 0;
        let a, b;
        sc.run(() => {
            a = resource({ params: { b: 1, a: 2 }, loader: async ({ params }) => { loads++; return { sum: params.a + params.b }; } }, { cache: true, staleTime: 60000 });
            b = resource({ params: { a: 2, b: 1 }, loader: async ({ params }) => { loads++; return { sum: params.a + params.b }; } }, { cache: true, staleTime: 60000 });
        });
        await settled();
        assert('cache: loader + cache — один loader-вызов, общая запись, порядок полей params не важен', loads === 1 && a.data.value?.sum === 3 && a.data.value === b.data.value);

        // ключи-массивы с реактивной частью + invalidate(['users'])
        const uid = signal(1);
        let lu;
        const seenKeys = [];
        sc.run(() => { lu = resource(() => '/t/u/' + uid.value, { cache: { key: ['users', () => uid.value] }, staleTime: 60000, fetcher: async (u) => { seenKeys.push(u); return { u }; } }); });
        await settled();
        uid.value = 2;
        await settled();
        assert('cache: ключ-массив с реактивной частью переключает записи', seenKeys.length === 2 && lu.key.value === 'users' + String.fromCharCode(0) + '2');
        const before = seenKeys.length;
        await invalidate(['users']);
        assert('cache: invalidate([\'users\']) — иерархический префикс, Promise ждёт перезапрос', seenKeys.length === before + 1);

        // invalidate: prefix '*', точный, E040 при промахе
        calls = [];
        await invalidate('/t/c*');
        assert('cache: invalidate(\'/t/c*\') — префикс, перезапрос живой записи', calls.length === 1);
        dev.resetWarnings();
        await invalidate('/t/c?page=1&q=b');
        const e40 = seen.find(w => w.code === 'E040');
        assert('E040: invalidate без совпадений — did-you-mean', e40 && /q=a/.test(e40.fix));

        // гонка: in-flight + invalidate после мутации → данные ПОСЛЕ мутации
        let version = 1;
        const gate = [];
        const slow = (url) => new Promise(res => gate.push(() => res({ v: version })));
        let race;
        sc.run(() => { race = resource('/t/race', { cache: true, fetcher: slow }); });
        version = 2;                          // «мутация на сервере» пока первый запрос в полёте
        const inv = invalidate('/t/race');    // force вытесняет летящий запрос
        gate.shift()();                       // старый ответ (v1 — нет: fetcher читает version при резолве; эмулируем старый ответ явно)
        await Promise.resolve();
        gate.shift()();
        await inv; await settled();
        assert('cache: invalidate во время in-flight не возвращает старые данные', race.data.value?.v === 2 && gate.length === 0);

        // mutate() побеждает летящий запрос
        let m2;
        sc.run(() => { m2 = resource('/t/opt', { cache: true, fetcher: (u) => new Promise(res => gate.push(() => res({ list: [1, 2, 3] }))) }); });
        m2.mutate({ list: [1, 2] });
        gate.shift()();
        await settled();
        assert('cache: optimistic mutate() не откатывается ответом старого запроса', m2.data.value.list.length === 2);

        // keyed structural sharing: prepend сохраняет identity строк по id
        let ver = 0;
        const rowsFetcher = async () => ver === 0 ? [{ id: 1, n: 'a' }, { id: 2, n: 'b' }] : [{ id: 0, n: 'z' }, { id: 1, n: 'a' }, { id: 2, n: 'b' }];
        let kr;
        sc.run(() => { kr = resource('/t/rows', { cache: true, fetcher: rowsFetcher }); });
        await settled();
        const r1 = kr.data.value[0], r2 = kr.data.value[1];
        ver = 1;
        await kr.refresh();
        assert('share: prepend — строки с тем же id сохраняют identity', kr.data.value.length === 3 && kr.data.value[1] === r1 && kr.data.value[2] === r2 && kr.data.value[0].id === 0);
        const same = kr.data.value;
        await kr.refresh();
        assert('share: идентичный ответ → тот же объект', kr.data.value === same);

        // plain resource dedupe: два инстанса — один GET
        calls = [];
        let p1, p2;
        sc.run(() => { p1 = resource('/t/plain', { fetcher: (u) => fetcher(u) }); p2 = resource('/t/plain', { fetcher: (u) => fetcher(u) }); });
        await settled();
        assert('dedupe: два plain resource(url) с одним fetcher по умолчанию — здесь свои fetcher, поэтому 2 запроса (dedupe только для defaults.fetcher)', calls.length === 2);
        const savedFetcher = defaults.fetcher;
        defaults.fetcher = (u) => fetcher(u);
        calls = [];
        let d1, d2;
        sc.run(() => { d1 = resource('/t/dedupe'); d2 = resource('/t/dedupe'); });
        await settled();
        defaults.fetcher = savedFetcher;
        assert('dedupe: два plain resource(url) → один GET, у каждого свои сигналы', calls.length === 1 && d1.data.value && d2.data.value && d1.data !== d2.data);

        // prefetch → resource без staleTime не перезапрашивает (freshUntil)
        calls = [];
        await prefetch('/t/pre', { fetcher: (u) => fetcher(u) });
        let pr;
        sc.run(() => { pr = resource('/t/pre', { cache: true, fetcher: (u) => fetcher(u) }); });
        await settled();
        assert('prefetch: freshUntil на записи — 0 запросов после прогрева', calls.length === 1 && pr.data.value?.url === '/t/pre');

        // E039 staleTime > cacheTime
        dev.resetWarnings();
        sc.run(() => { resource('/t/e39', { cache: true, staleTime: 10000, cacheTime: 1000, fetcher }); });
        assert('E039: staleTime > cacheTime', seen.some(w => w.code === 'E039'));

        // mutation ждёт invalidates перед снятием pending
        calls = [];
        let mr;
        sc.run(() => { mr = resource('/t/mut', { cache: true, fetcher: (u) => new Promise(res => setTimeout(() => res(fetcher(u)), 20)) }); });
        await settled();
        const mut = mutation(async () => ({ ok: true }), { invalidates: '/t/mut' });
        const p = mut();
        await wait(5);
        assert('mutation: pending держится, пока invalidates не перезапросили', mut.pending.value === true);
        await p; await settled();
        assert('mutation: после await — списки свежие', mut.pending.value === false && calls.length === 2);

        sc.dispose();
        off();
        dev.resetWarnings();
        reset();
    })();

    section('💎 кэш фаза 2 — cache API, explain, fakeClock, статистика, prefetch hit/waste');

    await (async () => {
        reset();
        const T = await import('./aegis-test.js');
        const seen = [];
        const off = onWarn(w => seen.push(w));
        dev.resetWarnings();

        cache.set(['users', 7], { id: 7 });

        sc.run(() => { r = resource('/t2/a', { cache: true, staleTime: 30_000, cacheTime: 60_000, fetcher }); });
        await settled();

        sc.run(() => { resource('/t2/a', { cache: true, staleTime: 30_000, cacheTime: 60_000, fetcher }); });
        await settled();
        assert('explain/history: второй подписчик в пределах staleTime → fresh без запроса', calls === 1 && events.includes('/t2/a:mount/fresh'));
        await clock.advance(31_000);
        x = cache.explain('/t2/a');
        assert('explain: после staleTime — stale (по часам кэша, не Date.now)', x.state === 'stale' && x.age >= 31_000);
        sc.dispose();
        assert('explain: без подписчиков — gcIn по cacheTime', cache.explain('/t2/a').subscribers === 0 && cache.explain('/t2/a').gcIn > 0);
        await clock.advance(60_001);
        assert('cache.gc(now): запись собрана по часам', !cache.has('/t2/a') && cache.explain('/t2/a').state === 'absent');
        clock.restore();

        // subscribe держит запись, remove чистит
        let got = null;
        const unsub = cache.subscribe('/t2/sub', (v) => { got = v; });
        cache.set('/t2/sub', { n: 1 });
        assert('cache.subscribe: получает данные', got && got.n === 1 && cache.explain('/t2/sub').subscribers === 1);
        unsub();
        assert('cache.remove: возвращает число удалённых', cache.remove('/t2/*') >= 1 && !cache.has('/t2/sub'));

        // μ̂ и E042: 12 одинаковых ответов при staleTime 0
        dev.resetWarnings();
        const sc2 = createScope();
        let same;
        sc2.run(() => { same = resource('/t2/same', { cache: true, staleTime: 0, fetcher: async () => ({ v: 1 }) }); });
        await settled();
        for (let i = 0; i < 11; i++) { await same.refresh(); }
        const ex = cache.explain('/t2/same');
        assert('stats: unchanged считается, suggestedStaleTime есть', ex.fetches === 12 && ex.unchanged === 11 && ex.suggestedStaleTime > 0);
        assert('E042: staleTime слишком мал для неизменных данных', seen.some(w => w.code === 'E042'));
        sc2.dispose();

        // prefetch hit / waste
        reset(); events.length = 0;
        const clock2 = T.fakeClock(2_000_000);
        await prefetch('/t2/pf-hit', { fetcher, kind: 'hover', cacheTime: 100 });
        const sc3 = createScope();
        sc3.run(() => { resource('/t2/pf-hit', { cache: true, fetcher }); });
        await prefetch('/t2/pf-waste', { fetcher, kind: 'hover', cacheTime: 100 });
        await clock2.advance(200);
        const st = cache.stats();
        assert('prefetch: hit и waste учтены', st.prefetch.used === 1 && st.prefetch.wasted === 1 && st.prefetch.byKind.hover && stats().prefetch.used === 1);
        sc3.dispose();
        clock2.restore();
        assert('dev.cache(): снимок как массив', Array.isArray(dev.cache()) && dev.cache().every(e => 'state' in e && 'size' in e));

        // панель: вкладка cache показывает записи
        const panel = await dev.panel();
        const tabBtn = [...panel.shadow.querySelectorAll('.tabs button')].find(b => /cache/.test(b.textContent));
        tabBtn.click();
        await wait(0);
        const rowsN = panel.shadow.querySelectorAll('.ctable tbody tr').length;
        assert('panel: вкладка cache со строками записей', rowsN >= 1 && panel.shadow.querySelector('.ctable td.k').textContent.includes('/t2/pf-hit'));
        panel.close();

        offCache(); off(); dev.resetWarnings(); reset();
        defaults.motion = true;
    })();

    section('💎 кэш фаза 3 — лимиты SIEVE, байтовый бюджет, ленивое истечение, планировщик, polling');

    await (async () => {
        reset();
        const T = await import('./aegis-test.js');
        const seen = [];
        const off = onWarn(w => seen.push(w));
        dev.resetWarnings();
        const fetcher = async (u) => ({ u, rows: Array.from({ length: 50 }, (_, i) => ({ id: i, name: 'row ' + i })) });

        // maxEntries: незанятые записи вытесняются по SIEVE, занятые остаются
        configure({ cache: { maxEntries: 5 } });
        const sc = createScope();
        let live;
        sc.run(() => { live = resource('/t3/live', { cache: true, fetcher }); });
        await settled();
        for (let i = 0; i < 10; i++) cache.set('/t3/idle/' + i, { i });
        assert('SIEVE: размер кэша ≤ maxEntries, живая запись не вытеснена', cache.size().entries <= 5 && cache.has('/t3/live') && cache.size().evictions >= 5);
        cache.get('/t3/idle/9');                   // «посещена» — переживёт следующий проход
        for (let i = 10; i < 12; i++) cache.set('/t3/idle/' + i, { i });   // 2 вставки при 4 свободных слотах: посещённая переживает
        assert('SIEVE: посещённая запись переживает проход, старые непосещённые уходят', cache.has('/t3/idle/9') && !cache.has('/t3/idle/1'));

        // pin: не вытесняется
        cache.remove('/t3/idle*');
        sc.run(() => { resource('/t3/pinned', { cache: { pin: true }, fetcher }); });
        await settled();
        for (let i = 20; i < 30; i++) cache.set('/t3/idle/' + i, { i });
        assert('SIEVE: pin защищает запись', cache.has('/t3/pinned'));
        sc.dispose();

        // maxBytes: байтовый бюджет
        reset();
        configure({ cache: { maxEntries: 500, maxBytes: 20000 } });
        for (let i = 0; i < 20; i++) cache.set('/t3/big/' + i, { rows: Array.from({ length: 100 }, (_, k) => ({ id: k, name: 'row number ' + k })) });
        const sz = cache.size();
        assert('maxBytes: суммарный размер ≤ бюджета, часть записей вытеснена', sz.bytes <= 20000 && sz.entries < 20 && sz.evictions > 0);
        configure({ cache: { maxEntries: 500, maxBytes: 0 } });

        // ленивое истечение без таймера на запись: cacheTime: Infinity живёт, обычная истекает при следующем обращении
        reset();
        const clock = T.fakeClock(5_000_000);
        const sc2 = createScope();
        sc2.run(() => { resource('/t3/inf', { cache: true, cacheTime: Infinity, fetcher }); resource('/t3/short', { cache: true, cacheTime: 1000, fetcher }); });
        await settled();
        sc2.dispose();
        clock.set(5_000_000 + 5000);
        assert('lazy GC: истёкшая запись собрана, cacheTime: Infinity живёт до лимитов', !cache.has('/t3/short') && cache.has('/t3/inf') && cache.explain('/t3/inf').gcIn === Infinity);
        clock.restore();

        // планировщик: focus → одна склейка, token bucket, приоритет, стаггер; события в скрытой вкладке откладываются
        reset();
        configure({ revalidate: { focus: 5000, reconnect: 2000, concurrency: 2, stagger: 0, reconnectJitter: 0 } });
        let calls = 0;
        const f2 = async (u) => { calls++; return { u }; };
        const sc3 = createScope();
        sc3.run(() => { for (let i = 0; i < 6; i++) resource('/t3/rv/' + i, { cache: true, staleTime: 0, fetcher: f2 }); });
        await settled();
        calls = 0;
        window.dispatchEvent(new Event('focus'));
        window.dispatchEvent(new Event('focus'));          // второй в пределах bucket — дропается
        await T.waitFor(() => calls === 6, { timeout: 2000 });
        assert('scheduler: focus перезапросил все живые записи ровно один раз (склейка + token bucket)', calls === 6);
        calls = 0;
        window.dispatchEvent(new Event('online'));
        await T.waitFor(() => calls === 6, { timeout: 2000 });
        assert('scheduler: reconnect с джиттером 0 — те же 6, не 12', calls === 6);
        sc3.dispose();
        configure({ revalidate: { focus: 5000, reconnect: 2000, concurrency: 6, stagger: 40, reconnectJitter: 2000 } });

        // polling: interval с функцией от данных, backoff при ошибке, один таймер
        reset();
        let n = 0;
        const sc4 = createScope();
        let pr;
        sc4.run(() => { pr = resource('/t3/poll', { cache: true, interval: (d) => (d && d.n >= 3 ? 0 : 60), fetcher: async () => ({ n: ++n }) }); });
        await settled();
        await T.waitFor(() => n >= 3, { timeout: 5000 });
        const nAt3 = n;
        await wait(250);
        assert('poll: interval как функция от данных — остановился на n=3', nAt3 === 3 && n === 3 && pr.data.value.n === 3);
        sc4.dispose();

        off(); dev.resetWarnings(); reset();
        defaults.motion = true;
    })();

    section('💎 кэш фаза 4 — ETag/304, staleTime http/auto, Aegis-Invalidate, Retry-After, breaker, retry budget');

    await (async () => {
        reset();
        const seen = [];
        const off = onWarn(w => seen.push(w));
        dev.resetWarnings();
        const savedFetcher = defaults.fetcher;
        // mock-сервер через configure({ fetch }): ETag + 304, Cache-Control, Aegis-Invalidate
        const srv = { version: 1, log: [] };
        const json = (data, status = 200, headers = {}) => new Response(status === 304 ? null : JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json', ...headers } });
        configure({ fetch: async (url, init) => {
            const u = new URL(url, location.href); const h = new Headers(init && init.headers);
            srv.log.push((init && init.method || 'GET') + ' ' + u.pathname + (h.get('If-None-Match') ? ' inm=' + h.get('If-None-Match') : ''));
            if (u.pathname === '/t4/etag') { const tag = '"v' + srv.version + '"'; if (h.get('If-None-Match') === tag) return json(null, 304, { ETag: tag }); return json({ v: srv.version }, 200, { ETag: tag }); }
            if (u.pathname === '/t4/http') return json({ ok: 1 }, 200, { 'Cache-Control': 'private, max-age=60, stale-while-revalidate=300', Age: '45' });
            if (u.pathname === '/t4/users') return json([{ id: 1 }]);
            if (u.pathname === '/t4/users/add') return json({ id: 2 }, 201, { 'Aegis-Invalidate': '/t4/users*' });
            if (u.pathname === '/t4/flaky') return json({ message: 'down' }, 503);
            if (u.pathname === '/t4/ra') return json({ message: 'slow down' }, 429, { 'Retry-After': '0.05' });
            return json({ message: 'nf' }, 404);
        } });

        // ETag → If-None-Match → 304
        const sc = createScope();
        let et;
        sc.run(() => { et = resource('/t4/etag', { cache: true, staleTime: 0 }); });
        await settled();
        await et.refresh();
        const hist = cache.explain('/t4/etag').history;
        assert('ETag: второй запрос ушёл с If-None-Match и получил 304, данные те же', srv.log.filter(l => l.includes('inm=')).length === 1 && hist.some(h => h.status === '304') && et.data.value.v === 1 && cache.explain('/t4/etag').etag === '"v1"');
        srv.version = 2;
        await et.refresh();
        assert('ETag: изменение на сервере → 200 с новым телом', et.data.value.v === 2 && cache.explain('/t4/etag').etag === '"v2"');
        sc.dispose();

        // staleTime: 'http' — max-age 60 − Age 45 = 15 с свежести
        const sc2 = createScope();
        let hr;
        sc2.run(() => { hr = resource('/t4/http', { cache: true, staleTime: 'http', cacheTime: 'http' }); });
        await settled();
        const hx = cache.explain('/t4/http');
        assert('staleTime http: свежесть из Cache-Control/Age', hx.state === 'fresh' && hx.staleTime === 60000 && hx.age >= 45000 && /fresh for 1[0-5]\d{3} ms/.test(hx.why) && hx.staleTimeMode === 'http' && hx.cacheTime === 360000);
        sc2.dispose();

        // staleTime: 'auto' — без наблюдений консервативный минимум
        const sc3 = createScope();
        sc3.run(() => { resource('/t4/users', { cache: true, staleTime: 'auto' }); });
        await settled();
        assert('staleTime auto: min 1000 мс без наблюдений', cache.explain('/t4/users').staleTime === 1000 && cache.explain('/t4/users').staleTimeMode === 'auto');
        // Aegis-Invalidate заголовок ответа
        const before = srv.log.filter(l => l.endsWith('/t4/users')).length;
        await api.post('/t4/users/add', { name: 'x' });
        await settled();
        assert('Aegis-Invalidate: ответ мутации перезапросил /t4/users*', srv.log.filter(l => l.endsWith('/t4/users')).length === before + 1);
        sc3.dispose();

        // Retry-After как floor: задержка ≥ 50 мс, потом успех
        let tries = 0;
        const t0 = performance.now();
        try { await withRetry(async () => { tries++; if (tries < 2) throw Object.assign(new HttpError(429, { headers: new Headers({ 'Retry-After': '0.05' }) }, null), {}); return 'ok'; }, { retries: 3, base: 1 }); } catch (e) { /* */ }
        assert('withRetry: Retry-After — нижняя граница задержки', tries === 2 && performance.now() - t0 >= 45);
        let long = null;
        try { await withRetry(async () => { throw new HttpError(429, { headers: new Headers({ 'Retry-After': '120' }) }, null); }, { retries: 3, maxWait: 100 }); } catch (e) { long = e; }
        assert('withRetry: Retry-After больше maxWait → сразу ошибка с retryAfter', long && long.retryAfter === 120000);

        // circuit breaker per origin
        configure({ breaker: { threshold: 2, cooldown: 300 } });
        let e1 = null, e2 = null, e3 = null;
        const hits = srv.log.length;
        try { await api.get('/t4/flaky'); } catch (e) { e1 = e; }
        try { await api.get('/t4/flaky'); } catch (e) { e2 = e; }
        try { await api.get('/t4/flaky'); } catch (e) { e3 = e; }
        assert('breaker: после threshold ошибок запрос падает сразу, без сети', e1.status === 503 && !e1.circuit && e3 && e3.circuit === true && e3.retryAt > Date.now() - 1 && srv.log.length === hits + 2);
        await wait(700);
        let e4 = null;
        try { await api.get('/t4/users'); } catch (e) { e4 = e; }
        assert('breaker: после cooldown — probe проходит (half-open → closed при успехе)', e4 === null && srv.log.length === hits + 3);
        configure({ breaker: null });

        // retry budget
        configure({ retryBudget: { ratio: 0, min: 1, window: 10000 } });
        let b1 = null, n1 = 0;
        try { await withRetry(async () => { n1++; throw new HttpError(503, { headers: new Headers() }, null); }, { retries: 5, base: 1 }); } catch (e) { b1 = e; }
        assert('retry budget: сверх лимита повтор отклонён с e.budget', b1 && b1.budget === true && n1 === 2);
        configure({ retryBudget: null });

    section('💎 доступность фаза 5a — announce 2.0 и live(), фокус после навигации, непрерывность фокуса, состояния сети, авто-ARIA');

    await (async () => {
        const codes = [];
        const offW = onWarn((w) => codes.push(w.code));
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));
        const politeNodes = () => [...document.querySelectorAll('[data-aegis-live="polite"] [aria-live]')];

        await sc.run(async () => {
            announce.init();

            await sleep(400); announce.clear();   // дождаться отложенных объявлений предыдущих секций (route announcer после кадра)
            const wrap = document.querySelector('[data-aegis-live="polite"]');
            const recs = []; const mo = new MutationObserver((rs) => recs.push(...rs)); mo.observe(wrap, { childList: true, subtree: true, characterData: true });
            announce('alpha'); announce('beta');
            await sleep(60);
            const sawAlpha = politeNodes().some(n => n.textContent === 'alpha');
            await sleep(250);
            mo.disconnect();
            assert('announce 2.0: два сообщения в одном тике — оба произнесены по очереди, ни одно не потеряно', sawAlpha && politeNodes().some(n => n.textContent === 'beta') && recs.length >= 2);
            announce.clear();
            announce('same'); announce('same');
            await sleep(200);
            assert('announce 2.0: одинаковый текст в течение 500 мс — один раз (дедуп)', politeNodes().filter(n => n.textContent === 'same').length === 1);
            const before = politeNodes().map(n => n.textContent).join('|');
            announce('urgent', 'assertive');
            assert('announce 2.0: assertive — сразу и в отдельный alert-регион, polite не тронут', alertNodes().some(n => n.textContent === 'urgent') && politeNodes().map(n => n.textContent).join('|') === before);
            const clear = announce('temp', { politeness: 'assertive', dedupe: 0 });
            clear();
            assert('announce 2.0: возвращённый clear() убирает текст', !alertNodes().some(n => n.textContent === 'temp'));
            announce.clear();
            const count = signal(0);
            const stop = live(count, { debounce: 20, format: (v) => v + ' результатов' });
            await sleep(40);
            assert('live(): начальное значение не объявляется', !politeNodes().some(n => /результатов/.test(n.textContent)));

            for (let i = 0; i < 40 && !politeNodes().some(n => n.textContent === '5 результатов'); i++) await sleep(20);
            assert('live(): поток записей склеен debounce в одно объявление с последним значением', politeNodes().filter(n => /результатов/.test(n.textContent)).length === 1 && politeNodes().some(n => n.textContent === '5 результатов'));
            stop();

        // 2. непрерывность фокуса при удалении (в видимом контейнере)
        await sc.run(async () => {

        await sc.run(async () => {
            const host = document.createElement('div'); sandbox.appendChild(host);

            host.appendChild(when(res, { data: (d) => html`<b>${d.n}</b>`, loading: () => html`<i>…</i>` }, { announce: { data: (d) => d.n + ' items' } }));

            const host2 = document.createElement('div'); sandbox.appendChild(host2);
            const bad = resource('/a11y/bad', { fetcher: async () => { throw new Error('boom'); } });
            host2.appendChild(when(bad, { error: (e) => html`<p>${e.message}</p>` }));
            await settled(); await sleep(5);
            assert('when: ошибка объявляется assertive с текстом ошибки', alertNodes().some(n => n.textContent === 'boom'));
            const host3 = document.createElement('div'); sandbox.appendChild(host3);
            const bad2 = resource('/a11y/bad2', { fetcher: async () => { throw new Error('silent'); } });

    section('💎 фаза A2 — dispose как транзакция, одно ребро владения, точные оценки стоимости (list = mid − |LIS| + вставки)');

    await (async () => {
        // 1. Транзакционный dispose в компоненте: cleanup пишет сигнал — соседний эффект того же scope не бежит по разрушенному DOM
        const s = signal(1); const log = [];
        const sc = createScope();
        sc.run(() => {
            effect(() => { s.value; return () => { s.value = 99; }; }, 'A');
            effect(() => { log.push('B:' + s.value); }, 'B');
        });
        log.length = 0; sc.dispose();
        assert('dispose — транзакция: эффект B не выполнился поверх записи из cleanup A', log.length === 0);

        // 2. L1: вложенный эффект — одно ребро владения
        const sc2 = createScope(); let outerNode; const t = signal(0);
        sc2.run(() => { outerNode = effect(() => { t.value; effect(() => {}); })._node; });
        assert('L1: у scope один disposer, у запуска один ребёнок', sc2._disposers.size === 1 && outerNode._kids.length === 1);
        sc2.dispose();

        // 3. Bound-as-oracle: число insertBefore в list() ровно mid − |LIS| + вставки (независимая O(n²) LIS)
        const lisLen = (a) => { const d = a.map(() => 1); for (let i = 0; i < a.length; i++) for (let j = 0; j < i; j++) if (a[j] < a[i]) d[i] = Math.max(d[i], d[j] + 1); return Math.max(0, ...d); };
        const expectedMoves = (oldKeys, newKeys) => {
            let st = 0; while (st < oldKeys.length && st < newKeys.length && oldKeys[st] === newKeys[st]) st++;
            let eo = oldKeys.length - 1, en = newKeys.length - 1; while (en > st && eo > st && oldKeys[eo] === newKeys[en]) { eo--; en--; }
            const idx = new Map(oldKeys.slice(st, eo + 1).map((k, i) => [k, i])); const mid = newKeys.slice(st, en + 1);
            const pos = mid.map(k => idx.has(k) ? idx.get(k) : -1); const inserts = pos.filter(p => p < 0).length;
            return inserts + (mid.length - inserts - lisLen(pos.filter(p => p >= 0)));
        };
        let seed = 7; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
        const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
        const ul = document.createElement('ul'); sandbox.appendChild(ul);
        let moves = 0; const ib = ul.insertBefore; ul.insertBefore = function (n, r) { moves++; return ib.call(this, n, r); };
        const byId = new Map(); const item = (id) => byId.get(id) || (byId.set(id, { id }), byId.get(id));
        const items = signal([1, 2, 3, 4, 5, 6, 7, 8].map(item));
        const sc3 = createScope();
        sc3.run(() => ul.append(list(items, (it) => html`<li>${it.id}</li>`)));
        await new Promise(r => setTimeout(r, 0));   // строки списка, смонтированного фрагментом, появляются после отложенного якоря
        let bad = null, over = 0;
        for (let k = 0; k < 120 && !bad; k++) {
            const oldKeys = items.peek().map(i => i.id);
            const pool = [...new Set([...oldKeys, ...Array.from({ length: 3 }, () => 1 + (rnd() * 12 | 0))])];
            const next = shuffle(pool).slice(0, 2 + (rnd() * 10 | 0));
            const before = new Map([...ul.children].map(li => [+li.textContent, li]));
            moves = 0; items.value = next.map(item);
            const got = [...ul.children].map(li => +li.textContent), exp = expectedMoves(oldKeys, next);
            if (moves > exp) over++;
            if (got.join() !== next.join() || got.some((id, i) => before.has(id) && before.get(id) !== ul.children[i])) bad = { k, oldKeys, next, got };
            else if (moves > exp) bad = bad || null;
        }
        assert('list(): порядок и идентичность узлов на 120 случайных перестановках', !bad, bad ? JSON.stringify(bad) : '');
        assert('list(): число перемещений не превышает mid − |LIS| + вставки (оптимальность LIS-сверки)', over === 0, over ? over + ' раз(а) больше оптимума' : '');
        sc3.dispose(); ul.remove();
        reset();
    })();

    section('💎 фаза B2 — list(): дельты reactive-массивов, moveBefore, rebuild-план, стриминговая досборка, view transitions, гибернация');

    await (async () => {
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));
        const row = (it) => html`<li>${it.n}</li>`;
        // 1. Дельты reactive-массива: push/splice — O(|Δ|) мутаций DOM, без полной сверки
        const rr = reactive([{ id: 1, n: 'a' }, { id: 2, n: 'b' }, { id: 3, n: 'c' }]);
        const ul = document.createElement('ul'); sandbox.appendChild(ul);
        const sc = createScope();
        sc.run(() => ul.append(list(rr, row)));
        await sleep(0);
        const mo = new MutationObserver(() => {}); mo.observe(ul, { childList: true });
        rr.push({ id: 4, n: 'd' });
        let recs = mo.takeRecords();
        assert('дельта: push → одна childList-мутация с одним добавленным узлом', recs.length === 1 && recs[0].addedNodes.length === 1 && ul.textContent === 'abcd');
        rr.splice(1, 1);
        recs = mo.takeRecords();
        assert('дельта: splice(1,1) → одна мутация, порядок верный', recs.length === 1 && recs[0].removedNodes.length === 1 && ul.textContent === 'acd');
        rr.unshift({ id: 5, n: 'z' });
        assert('дельта: unshift — строка встала первой', ul.textContent === 'zacd' && ul.children[0].textContent === 'z');
        rr[2] = { id: 6, n: 'Q' };
        assert('дельта: запись по индексу — replace на месте', ul.textContent === 'zaQd');
        rr.sort((x, y) => x.n.localeCompare(y.n));
        assert('дельта: sort → сброс лога, полная сверка даёт верный порядок', ul.textContent === rr.map(x => x.n).join(''));
        mo.disconnect(); sc.dispose(); ul.remove();

        // 2. Identity-trim иммутабельных массивов: замена одного объекта из 300 — ключи только для середины (проверяем корректность)

        const ul2 = document.createElement('ul'); sandbox.appendChild(ul2);
        const sc2 = createScope(); sc2.run(() => ul2.append(list(big, row)));

        // 3. Rebuild-план: разворот 300 строк — план rebuild, порядок верный, scope строк живы (эффекты не пересозданы)

        assert('rebuild-план: разворот 300 строк выбирает rebuild и даёт верный порядок', plan && plan.plan === 'rebuild' && ul2.children[0].textContent === 'r299' && ul2.children[299].textContent === 'r0');

        sc2.dispose(); ul2.remove();

        await sleep(0);

        await nextTick();
        assert('streaming: после nextTick все строки на месте и в порядке', ul4.children.length === 400 && ul4.children[0].textContent === 'n0' && ul4.children[399].textContent === 'n399' && pending.value === false);
        sc4.dispose(); ul4.remove();

        // 6. View transitions: одна document.startViewTransition на flush для двух списков, DOM уже переставлен внутри колбэка
        const origVT = document.startViewTransition; let vtCalls = 0, insideOrder = null;
        document.startViewTransition = (cb) => { vtCalls++; cb(); insideOrder = ul5.textContent; return { ready: Promise.resolve(), finished: Promise.resolve(), updateCallbackDone: Promise.resolve() }; };
        const va = signal([{ id: 1, n: 'a' }, { id: 2, n: 'b' }]), vb = signal([{ id: 1, n: 'x' }]);
        const ul5 = document.createElement('ul'), ul6 = document.createElement('ul'); sandbox.append(ul5, ul6);

        await nextTick(); await sleep(0);

        document.startViewTransition = origVT; sc5.dispose(); ul5.remove(); ul6.remove();

    section('💎 фаза B3 — morph: якоря Heckel + LIS, минимальные перемещения, оракул isEqualNode');

    await (async () => {
        const mk = (htmlStr) => { const t = document.createElement('template'); t.innerHTML = htmlStr; return t.content.firstElementChild; };
        const lis = (n, f) => Array.from({ length: n }, (_, i) => f(i)).join('');

        let textWrites = 0; const desc = Object.getOwnPropertyDescriptor(CharacterData.prototype, 'data');
        Object.defineProperty(CharacterData.prototype, 'data', { configurable: true, get: desc.get, set(v) { textWrites++; desc.set.call(this, v); } });
        let attrWrites = 0; const sa = Element.prototype.setAttribute; Element.prototype.setAttribute = function (n, v) { attrWrites++; return sa.call(this, n, v); };

        host.remove();

        const tbl = mk('<table><tbody>' + lis(100, i => `<tr id="r${i}"><td>${i}</td></tr>`) + '</tbody></table>'); sandbox.appendChild(tbl);
        const tb = tbl.tBodies[0]; const rows = [...tb.rows];

        const order = [99, ...Array.from({ length: 99 }, (_, i) => i)];
        await swap(tbl, '<table><tbody>' + order.map(i => `<tr id="r${i}"><td>${i}</td></tr>`).join('') + '</tbody></table>', { mode: 'morph' });
        const recs = mo.takeRecords(); mo.disconnect();
        const moved = recs.reduce((a, r) => a + r.addedNodes.length, 0);
        assert('morph: строка 99 → 0 — одно перемещение (LIS), идентичность всех строк сохранена', moved <= 1 && tb.rows[0] === rows[99] && tb.rows[1] === rows[0] && tb.rows.length === 100);

        let seed = 11; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

    section('💎 #2 — show() scope cleanup');
    await (async () => {
        const visible = signal(true);
        let effectRuns = 0;
        const anchor = show(visible,
            () => {
                const el = document.createElement('div');
                el.textContent = 'visible';
                // This effect should be disposed when branch switches
                effect(() => { effectRuns++; });
                return el;
            },
            () => {

        );
        sandbox.appendChild(anchor);
        await new Promise(r => queueMicrotask(r));

        assert('show scope: effect runs on mount', runsAfterMount >= 1);

        // Switch to false branch — true branch scope should dispose
        visible.value = false;
        await new Promise(r => queueMicrotask(r));

        // Reset counter tracking
        const runsBeforeSwitch = effectRuns;
        // If scope was properly disposed, no more effect runs from true branch
        // Trigger a signal change that would fire the old effect if it leaked
        visible.value = true;
        await new Promise(r => queueMicrotask(r));
        // A new effect instance runs, but the OLD one from first true-branch should be dead
        assert('show scope: branches are independent', true); // structural test — no crash

        tip.textContent = 'Tooltip';
        tip.style.cssText = 'width:60px;height:20px;';
        sandbox.appendChild(ref);
        sandbox.appendChild(tip);

        const cleanup = anchor(tip, ref, { placement: 'bottom', offset: 8 });
        assert('anchor: returns cleanup function', typeof cleanup === 'function');
        assert('anchor: floating is positioned', tip.style.position === 'fixed');

        cleanup();
        sandbox.innerHTML = '';
    }

    // ======= 💎 #16b — router() =======
    section('💎 #16b — router()');
    {
        let homeRendered = false;
        let userParams = null;

        const r = router({
            '/': () => { homeRendered = true; },
            '/users/:id': (p) => { userParams = p; },
        });

        assert('router: route is signal', typeof r.route?.value === 'string');
        assert('router: params is signal', typeof r.params?.value === 'object');
        assert('router: query is signal', typeof r.query?.value === 'object');
        assert('router: navigate is function', typeof r.navigate === 'function');
        assert('router: back is function', typeof r.back === 'function');
        assert('router: cleanup is function', typeof r.cleanup === 'function');

        r.cleanup();
    }

    // ======= 💎 #16c — command() =======
    section('💎 #16c — command()');
    {
        const root = document.createElement('div');
        let triggered = null;
        let targetEl = null;

        root.innerHTML = `
            <button data-command="do-thing" data-target="#cmd-target">Do</button>
            <div id="cmd-target">Target</div>
        `;
        sandbox.appendChild(root);

        const cmd = command(root, {
            'do-thing': (trigger, target) => {
                triggered = trigger.textContent;
                targetEl = target;
            },
        });

        assert('command: returns object', cmd != null);
        assert('command: has dispose()', typeof cmd.dispose === 'function');
        assert('command: has add()', typeof cmd.add === 'function');

        // Simulate click
        root.querySelector('button').click();
        assert('command: handler called', triggered === 'Do');
        assert('command: target resolved', targetEl?.id === 'cmd-target');

        // Dynamic add
        cmd.add('new-cmd', () => { triggered = 'new'; });
        const btn2 = document.createElement('button');
        btn2.dataset.command = 'new-cmd';
        btn2.textContent = 'New';
        root.appendChild(btn2);
        btn2.click();
        assert('command: dynamic add works', triggered === 'new');

        cmd.dispose();
        sandbox.innerHTML = '';
    }

    // ======= 💎 #16d — virtualScroll() =======
    section('💎 #16d — virtualScroll()');
    {
        const parent = document.createElement('div');
        parent.style.cssText = 'height:200px;overflow:auto;';
        sandbox.appendChild(parent);

        const items = Array.from({ length: 500 }, (_, i) => ({ id: i, name: `Item ${i}` }));

        const vs = virtualScroll(parent, items, {
            itemHeight: 40,
            chunkSize: 50,
            renderItem: (item) => {
                const div = document.createElement('div');
                div.style.height = '40px';
                div.textContent = item.name;
                return div;
            },
        });

        assert('virtualScroll: returns container', vs.container instanceof HTMLElement);
        assert('virtualScroll: has refresh()', typeof vs.refresh === 'function');
        assert('virtualScroll: has dispose()', typeof vs.dispose === 'function');

        // Check chunks created (500 items / 50 = 10 chunks)
        const chunks = vs.container.children;
        assert('virtualScroll: chunks created', chunks.length === 10);

        // Each chunk has content-visibility
        const firstChunk = chunks[0];
        assert('virtualScroll: content-visibility set',
            firstChunk.style.contentVisibility === 'auto' ||
            firstChunk.style.cssText.includes('content-visibility'));

        // Items rendered inside chunks (each chunk is a direct child of container)
        let totalRendered = 0;
        for (const chunk of chunks) totalRendered += chunk.children.length;
        assert('virtualScroll: all items rendered', totalRendered === 500);

        vs.dispose();
        sandbox.innerHTML = '';
    }

    // ======= 💎 #17 — offlineResource() =======
    section('💎 #17 — offlineResource()');
    {
        let fetchCount = 0;
        const fakeData = { items: [1, 2, 3] };

        const r = offlineResource('/test/offline', {
            dbName: 'aegis-test',
            storeName: 'test-cache',
            fetcher: async () => { fetchCount++; return fakeData; },
        });

        assert('offlineResource: data is signal', typeof r.data?.value !== 'undefined');
        assert('offlineResource: loading is signal', typeof r.loading?.value === 'boolean');
        assert('offlineResource: error is signal', r.error != null);
        assert('offlineResource: online is signal', typeof r.online?.value === 'boolean');
        assert('offlineResource: syncing is signal', typeof r.syncing?.value === 'boolean');
        assert('offlineResource: refresh() exists', typeof r.refresh === 'function');
        assert('offlineResource: mutate() exists', typeof r.mutate === 'function');
        assert('offlineResource: dispose() exists', typeof r.dispose === 'function');

        // Wait for fetch (IDB в свежем headless-профиле может отвечать медленно)
        for (let i = 0; i < 300 && !r.data.peek(); i++) await new Promise(r => setTimeout(r, 10));
        assert('offlineResource: data loaded', r.data.peek()?.items?.length === 3);
        assert('offlineResource: not loading after fetch', r.loading.peek() === false);

        // Optimistic mutation (сетевая часть — через request(): мокаем fetch)
        configure({ fetch: async () => new Response('{"ok":true}', { status: 200, headers: { 'Content-Type': 'application/json' } }) });
        await r.mutate('POST', '/test/mutation', { new: true }, (old) => {
            return { ...old, items: [...old.items, 4] };
        }).catch(() => {});
        configure({ fetch: null });
        await new Promise(r => setTimeout(r, 50));
        assert('offlineResource: optimistic update', r.data.peek()?.items?.length === 4);

        r.dispose();
    }

    // ======= VERSION =======
    section('Version');
    assert('VERSION = 0.6.0', VERSION === '0.7.0');

    // ======= SUMMARY =======

    const summary = document.getElementById('summary');
    const total = passed + failed;
    summary.className = failed === 0 ? 'summary-pass' : 'summary-fail';
    summary.textContent = failed === 0
        ? `✓ All ${total} tests passed`
        : `✗ ${failed} of ${total} tests failed`;
    if (REPORT) fetch('/__report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ua: navigator.userAgent, passed, failed, fails: [...document.querySelectorAll('.test.fail')].map(e => e.textContent) }) }).catch(() => {});

    </script>
</body>
